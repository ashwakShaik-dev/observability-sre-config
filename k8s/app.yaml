apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observability-api
  template:
    metadata:
      labels:
        app: observability-api
    spec:
      containers:
        - name: observability-api
          image: ashwak95/observability-sre:7c4d059d0c15ae5f55b6bd8d0dd5be3170c8c2d4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: observability-api
  labels:
    app: observability-api
spec:
  selector:
    app: observability-api
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP